<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SHADER_START:ANIMATION_26 class="fixed inset-0 w-full h-full" -->
<div class="fixed inset-0 w-full h-full" style="display:block;">
<canvas id="shader-canvas-ANIMATION_26" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_26');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;
varying vec2 v_texCoord;

// Circuit trace procedural animation inspired by image.png
float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
}

float lineSegment(vec2 p, vec2 a, vec2 b, float width) {
    vec2 pa = p - a, ba = b - a;
    float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
    return smoothstep(width, 0.0, length(pa - ba * h));
}

void main() {
    vec2 uv = (gl_FragCoord.xy) / u_resolution.xy;
    vec2 aspect = vec2(u_resolution.x / u_resolution.y, 1.0);
    vec2 st = uv * aspect * 6.0;

    // Subtle light architectural / clean tech gradient background
    vec3 col = mix(vec3(0.97, 0.98, 1.0), vec3(0.93, 0.95, 0.99), uv.y);

    // Glowing circuit network lines in red/crimson (#dc2626)
    vec3 circuitRed = vec3(0.86, 0.15, 0.15);
    vec3 circuitBright = vec3(1.0, 0.35, 0.35);

    float t = u_time * 0.8;

    // Diagonal circuit traces like in IMAGE_3
    float totalLines = 0.0;
    float glowNodes = 0.0;
    
    for (int i = 0; i < 5; i++) {
        float fi = float(i);
        float offset = fi * 1.35;
        
        // Horizontal feed
        vec2 p1 = vec2(0.2 + fi * 0.1, 1.2 + offset);
        vec2 p2 = vec2(1.5 + fi * 0.2, 1.2 + offset);
        // 45 degree branch
        vec2 p3 = vec2(3.2 + fi * 0.3, 2.9 + offset);
        // Vertical run
        vec2 p4 = vec2(3.2 + fi * 0.3, 4.8 + offset);

        // Adjust by aspect & screen pos
        vec2 p = st;
        p.y += mod(t * 0.5, 4.0);
        vec2 st_mod = mod(p, vec2(6.0, 6.0));

        float l1 = lineSegment(st_mod, p1, p2, 0.035);
        float l2 = lineSegment(st_mod, p2, p3, 0.035);
        float l3 = lineSegment(st_mod, p3, p4, 0.035);
        
        totalLines += max(l1, max(l2, l3));

        // Pulsing terminal nodes/rings
        float dNode1 = length(st_mod - p1);
        float ring1 = smoothstep(0.02, 0.0, abs(dNode1 - 0.12));
        float core1 = smoothstep(0.06, 0.0, dNode1) * (0.6 + 0.4 * sin(t * 3.0 + fi));

        float dNode2 = length(st_mod - p3);
        float ring2 = smoothstep(0.02, 0.0, abs(dNode2 - 0.12));
        float core2 = smoothstep(0.06, 0.0, dNode2) * (0.6 + 0.4 * cos(t * 2.5 + fi));

        glowNodes += (ring1 + core1 + ring2 + core2);

        // Moving data pulse packet along the circuit trace
        float pulsePhase = mod(t * 1.5 + fi * 0.7, 3.0);
        vec2 pulsePos = p1;
        if (pulsePhase < 1.0) {
            pulsePos = mix(p1, p2, pulsePhase);
        } else if (pulsePhase < 2.0) {
            pulsePos = mix(p2, p3, pulsePhase - 1.0);
        } else {
            pulsePos = mix(p3, p4, pulsePhase - 2.0);
        }
        float pulseDist = length(st_mod - pulsePos);
        glowNodes += smoothstep(0.18, 0.0, pulseDist) * 1.4;
    }

    // Blend circuits over light background with subtle glow
    col = mix(col, circuitRed, clamp(totalLines * 0.65, 0.0, 1.0));
    col += circuitBright * clamp(glowNodes * 0.75, 0.0, 1.0);

    // Subtle ambient grid dots
    vec2 grid = abs(fract(st * 2.0 - 0.5) - 0.5);
    float dotGrid = smoothstep(0.06, 0.0, length(grid)) * 0.08;
    col -= vec3(dotGrid * 0.4);

    gl_FragColor = vec4(col, 1.0);
}
`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
</div>
<!-- STITCH_SHADER_END:ANIMATION_26 -->


</body></html>
